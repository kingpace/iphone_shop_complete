
<!-- Product Card -->
<article class="product-card">

    <!-- Product Image -->
    <a
        class="product-visual"
        href="{{ url_for('product_details', id=product.id) }}"
    >

        {% if product.phone_picture %}

            <img
                src="{{ product.phone_picture }}"
                alt="{{ product.name }}"
                loading="lazy"
            >

        {% else %}

            <!-- Placeholder When No Image Exists -->
            <span class="phone-placeholder">
                ◧
            </span>

        {% endif %}

    </a>

    <!-- Product Information -->
    <div class="product-info">

        <!-- Condition and Storage -->
        <span class="eyebrow">
            {{ product.condition }} · {{ product.storage }}
        </span>

        <!-- Product Name -->
        <h3>
            {{ product.name }}
        </h3>

        <!-- Product Price -->
        <p class="price">
            £{{ '%.2f'|format(product.price) }}
        </p>

        <!-- Stock Availability -->
        <p class="muted">
            {{ product.stock_quantity }} available
        </p>

        <!-- Product Action Buttons -->
        <div class="card-actions">

            <!-- View Product Details -->
            <a
                class="button secondary small"
                href="{{ url_for('product_details', id=product.id) }}"
            >
                Details
            </a>

            <!-- Add to Cart Form -->
            <form
                method="post"
                action="{{ url_for('add_to_cart', id=product.id) }}"
            >

                <!-- CSRF Protection -->
                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >

                <!-- Add to Cart Button -->
                <button
                    type="submit"
                    class="button small"
                    {% if product.stock_quantity < 1 %}
                        disabled
                    {% endif %}
                >
                    Add to cart
                </button>

            </form>

        </div>

    </div>

</article>
