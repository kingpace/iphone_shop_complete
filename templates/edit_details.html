{% extends 'base.html' %}{% block title %}Edit profile | NOVA{% endblock %}{% block content %}<section class="auth-wrap"><form class="panel auth-panel" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><h1>Edit profile.</h1><label>Username<input name="username" value="{{ user.username }}" required></label><label>Email<input name="email" type="email" value="{{ user.email }}" required></label><label>Phone<input name="userphone" value="{{ user.userphone or '' }}"></label><button class="button wide">Save changes</button></form></section>{% endblock %}
