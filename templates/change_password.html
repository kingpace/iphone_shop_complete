
{% extends 'base.html' %}

{% block title %}
    Change password | NOVA
{% endblock %}

{% block content %}

<section class="auth-wrap">

    <!-- Change Password Form -->
    <form
        class="panel auth-panel"
        method="post"
    >

        <!-- CSRF Protection -->
        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >

        <!-- Form Heading -->
        <h1>
            Change password.
        </h1>

        <!-- Current Password -->
        <label>
            Current password

            <input
                type="password"
                name="old_password"
                required
                autocomplete="current-password"
            >
        </label>

        <!-- New Password -->
        <label>
            New password

            <input
                type="password"
                name="new_password"
                minlength="8"
                required
                autocomplete="new-password"
            >
        </label>

        <!-- Update Password Button -->
        <button
            type="submit"
            class="button wide"
        >
            Update password
        </button>

    </form>

</section>

{% endblock %}
