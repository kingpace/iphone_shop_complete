
{% extends 'base.html' %}

{% block title %}
    Sign in | NOVA
{% endblock %}

{% block content %}

<section class="auth-wrap">

    <!-- Login Form -->
    <form
        class="panel auth-panel"
        method="post"
    >

        <!-- CSRF Protection -->
        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >

        <!-- Form Heading -->
        <p class="eyebrow">
            WELCOME BACK
        </p>

        <h1>
            Sign in.
        </h1>

        <!-- Email -->
        <label>
            Email

            <input
                type="email"
                name="email"
                required
                autocomplete="email"
            >
        </label>

        <!-- Password -->
        <label>
            Password

            <input
                type="password"
                name="password"
                required
                autocomplete="current-password"
            >
        </label>

        <!-- Sign In Button -->
        <button
            type="submit"
            class="button wide"
        >
            Sign in
        </button>

        <!-- Registration Link -->
        <p>
            New here?

            <a href="{{ url_for('register') }}">
                Create an account
            </a>
        </p>

    </form>

</section>

{% endblock %}
