{% extends 'base.html' %}{% block title %}{{ heading }} | NOVA{% endblock %}{% block content %}<section class="container section narrow"><p class="eyebrow">ADMIN AREA</p><h1 class="page-title">{{ heading }}.</h1><form class="panel product-form" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Product name<input name="name" value="{{ product.name if product else '' }}" required maxlength="100"></label><label>Price (£)<input name="price" type="number" min="0" step="0.01" value="{{ product.price if product else '' }}" required></label><label>Description<textarea name="description" required rows="4">{{ product.description if product else '' }}</textarea></label><div class="form-grid"><label>Stock quantity<input name="stock_quantity" type="number" min="0" value="{{ product.stock_quantity if product else 0 }}" required></label><label>Storage<input name="storage" placeholder="256GB" value="{{ product.storage if product else '' }}" required></label><label>Colour<input name="colour" value="{{ product.colour if product else '' }}" required></label><label>Condition<select name="condition" required><option value="New" {% if product and product.condition=='New' %}selected{% endif %}>New</option><option value="Refurbished" {% if product and product.condition=='Refurbished' %}selected{% endif %}>Refurbished</option></select></label><label>Battery health (%)<input name="battery_health" type="number" min="0" max="100" value="{{ product.battery_health if product else 100 }}" required></label><label>Grade (optional)<input name="grade" placeholder="A" value="{{ product.grade if product and product.grade else '' }}"></label></div><label>Image URL (optional)<input name="phone_picture" type="url" placeholder="https://example.com/phone.jpg" value="{{ product.phone_picture if product else '' }}"></label><p class="muted">Use a direct image URL from a source you have permission to use.</p><div class="button-row"><button class="button">Save product</button><a class="button secondary" href="{{ url_for('admin') }}">Cancel</a></div></form></section>{% endblock %}
