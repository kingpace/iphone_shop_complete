{% extends 'base.html' %}{% block title %}Create account | NOVA{% endblock %}{% block content %}<section class="auth-wrap"><form class="panel auth-panel" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><p class="eyebrow">JOIN NOVA</p><h1>Create an account.</h1><label>Username<input name="username" required maxlength="50"></label><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Phone (optional)<input name="userphone" type="tel"></label><label>Password (8+ characters)<input name="password" type="password" minlength="8" required autocomplete="new-password"></label><button class="button wide">Create account</button><p>Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></form></section>{% endblock %}
