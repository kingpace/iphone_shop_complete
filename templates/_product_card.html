<article class="product-card"><a class="product-visual" href="{{ url_for('product_details', id=product.id) }}">{% if product.phone_picture %}<img src="{{ product.phone_picture }}" alt="{{ product.name }}" loading="lazy">{% else %}<span class="phone-placeholder">◧</span>{% endif %}</a><div class="product-info"><span class="eyebrow">{{ product.condition }} · {{ product.storage }}</span><h3>{{ product.name }}</h3><p class="price">£{{ '%.2f'|format(product.price) }}</p><p class="muted">{{ product.stock_quantity }} available</p><div class="card-actions"><a class="button secondary small" href="{{ url_for('product_details', id=product.id) }}">Details</a><form method="post" action="{{ url_for('add_to_cart', id=product.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="button small" {% if product.stock_quantity < 1 %}disabled{% endif %}>Add to cart</button></form></div></div></article>
